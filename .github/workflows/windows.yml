name: Build Windows

on:
  push:
    branches: [ "**" ]
    paths: [ "desktop/**", "app/src/main/java/com/deepshawn/hwcounter/data/**", ".github/workflows/windows.yml" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "把 Windows 安装包附加到这个版本（如 v1.1.0），留空则只构建"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build installer and portable app
        shell: bash
        run: ./gradlew --no-daemon :desktop:packageMsi :desktop:createDistributable

      - name: Collect files
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $msi = Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "out/HwCounter-Windows-$sha.msi"
          Compress-Archive -Path desktop/build/compose/binaries/main/app/HwCounter -DestinationPath "out/HwCounter-Windows-portable-$sha.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: HwCounter-Windows
          path: out/*

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out/*
          overwrite_files: true
