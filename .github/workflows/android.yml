name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本标签（如 v1.0.0），留空则只构建"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :desktop:test :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HwCounter-arm64-v8a-${GITHUB_SHA::7}.apk
          ls -la out

      - name: Inspect APK (ABI / size)
        run: |
          APK=$(ls out/*.apk)
          echo "== native libs =="; unzip -l "$APK" | grep "lib/" || true
          echo "== ML Kit models =="; unzip -l "$APK" | grep -i "mlkit\|ocr\|barcode" | head -20 || true
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging "$APK" | grep -E "package:|native-code|sdkVersion|application-label"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify --print-certs "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: HwCounter-arm64-v8a
          path: out/*.apk

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: sed "s/{{TAG}}/$TAG/g" .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: 作业通 ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: out/*.apk
