name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HwCounter-arm64-v8a-${GITHUB_SHA::7}.apk
          ls -la out

      - name: Inspect APK (ABI / size)
        run: |
          APK=$(ls out/*.apk)
          echo "== native libs =="; unzip -l "$APK" | grep "lib/" || true
          echo "== ML Kit models =="; unzip -l "$APK" | grep -i "mlkit\|ocr\|barcode" | head -20 || true
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging "$APK" | grep -E "package:|native-code|sdkVersion|application-label"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify --print-certs "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: HwCounter-arm64-v8a
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
