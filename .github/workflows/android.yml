name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本标签（如 v1.0.0），留空则只构建"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HwCounter-arm64-v8a-${GITHUB_SHA::7}.apk
          ls -la out

      - name: Inspect APK (ABI / size)
        run: |
          APK=$(ls out/*.apk)
          echo "== native libs =="; unzip -l "$APK" | grep "lib/" || true
          echo "== ML Kit models =="; unzip -l "$APK" | grep -i "mlkit\|ocr\|barcode" | head -20 || true
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump badging "$APK" | grep -E "package:|native-code|sdkVersion|application-label"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify --print-certs "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: HwCounter-arm64-v8a
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: 作业通 ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          body: |
            ## 📚 作业通 ${{ inputs.release_tag || github.ref_name }}（Android · iPad · 网页 三端同步）

            老师的收作业神器：拍照识别学号、语音登记、数本数、积分、统计、一键导出 Excel。

            **下载安装**
            - 📱 Android：下方 `HwCounter-arm64-v8a-*.apk`（Android 8.0+，64 位 ARM 手机）
            - 📲 iPad：下方 `HwCounter-iPad-unsigned-*.ipa`（iPadOS 16+，未签名，需用 AltStore / Sideloadly / 爱思助手 等用自己的 Apple ID 签名安装）
            - 🌐 网页版：https://deepshawn.github.io/hwcounter/ （可“添加到主屏幕”离线使用）

            ### ☁️ 云端同步 & 预览
            - 邮箱账号登录后，三端数据自动同步；两边都改过时可合并；云端保留 30 个历史版本
            - **不登录也能预览（只读），登录后才能修改**；老师可随时关闭“允许未登录预览”
            - App 内可修改密码；预览模式下不显示名单页，热力图照常可看

            ### 📝 草稿（只存本机，确认后再上传）
            - 登记先存成草稿，**只保存在本机**，不会自动同步；草稿页照常点选、首字母输入、按座位登记、写备注，✏️ 标出改过的同学
            - 「☁️ 上传」写进作业并立即同步到云端；「⏰ 定时上传」可选 45 分钟后 / 今晚 8 点 / 明早 7 点 / 任意时间（App 需开着；没开着时下次打开立即补传）
            - 上传只覆盖草稿里改过的同学，其它设备期间的登记不会被冲掉；首页「草稿箱」统一管理

            ### 📊 统计表识别
            - 拍照 / Excel（.xlsx）/ CSV / 粘贴登记表，自动找出姓名或学号列和标记列，认识 ✓ √ 交 1、优 A ★、迟 补、× X 缺 0、假 病 等写法
            - 立即给出交齐率、各状态人数和未交名单，可逐人修改；多列可选列或每列各存一份草稿；可存为新作业草稿或写入已有作业

            ### 📋 统计名单 Excel 导出
            - 每次作业 / 草稿 / 识别结果：统计汇总 + 分类名单（已交/优秀/迟交/未交/请假/未登记各一列）+ 明细
            - 全班「各次统计名单」：每次作业一行，含未交、迟交、请假、未登记名单；iPad 版也能导出 Excel 了

            ### 🪑 座位表
            - 导入座位表自动排列：**拍一张座位表照片自动识别**（认出姓名/学号的位置，自动分排分列、判断讲台在哪边），或粘贴 Excel、导入文件，或按学号自动排列
            - 点两个座位互换，未入座的同学点一下再点空位即可入座；讲台换边、增减行列
            - 登记作业时按座位表点选：点座位切换已交，点“排”“列”整排/整列一起登记

            ### ⌨️ 输入拼音首字母登记
            - 在作业页输入 `zjy lzh wf`（空格隔开或连着写都行，也可写学号、姓名），选好状态一键登记；首字母重复时让你点选

            ### 🎙️ 语音念首字母
            - 可以直接念名字的拼音首字母：“Z J Y” = 张锦宇；连着念几个人也能拆开（“ZJY LZH”）
            - 识别成汉字的字母读音也认（“贼杰歪” = ZJY）

            ### ✨ 主要功能
            - 📸 拍照/相册多选识别作业本封面学号、姓名、二维码，自动去重，可手动补录
            - 🎙️ 语音登记：连续念名字或学号依次登记，同音字按拼音匹配，支持中文数字和连读学号，可撤销
            - 🎥 实时扫描：逐本翻封面，识别即“嘀”一声
            - 📏 侧面学号：学号写在作业本侧面，拍一摞侧面自动读出每本学号并数出本数，条纹复核漏读
            - 📄 数试卷：针对极薄纸张优化（亚像素采样、自动对齐纸边、多线投票、两种算法互证 + 置信度、放大条带逐张核对）
            - 📦 数本数：拍一摞侧面画扫描线自动计数，并与登记人数比对
            - 🧠 本地离线 OCR（免费、隐私安全）或接入多模态大模型（DeepSeek/通义千问/豆包/智谱/Kimi/OpenAI/Claude/Ollama…，支持纯文本模型校对 OCR）
            - ✅ 已交/优秀/迟交/未交/请假，长期请假自动处理，批量操作与撤销
            - 🧮 可配置计分规则（默认未交 −2），手动加减分，个人/小组/催交榜
            - 📊 趋势图、状态分布、各科对比、全班热力图
            - 📤 Excel / CSV / 战报海报 / 家长群文字通报；🏷️ 学号二维码贴纸 PDF
            - 📥 JSON/CSV/粘贴导入名单；🎨 10 套主题 × 深浅色 × 圆角 × 4 种排版；💾 备份恢复

            > 首次打开为空白状态：导入名单 JSON/CSV 或手动新建班级即可开始。
          files: out/*.apk
