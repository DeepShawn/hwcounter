name: UI screenshots

# 用 Robolectric 渲染主要页面并上传截图（检查布局用，不影响 APK 构建）
on:
  workflow_dispatch:
  push:
    branches: [ "ccr-*" ]
    paths: [ "app/src/main/java/com/deepshawn/hwcounter/ui/**", "app/src/shots/**", ".github/workflows/screenshots.yml" ]

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Pshots :app:testDebugUnitTest --tests "*ShotsTest*"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            shots/*.png
            app/build/reports/tests/testDebugUnitTest/
